<!--
  スクリーンショットを原寸で見られるようにする。
  jekyll-theme-minimal は本文を狭い段に収めるため、UIの細部が読めない。
  画像をクリックすると全画面のオーバーレイで開く。

  依存ライブラリは使わない（GitHub Pages のビルドに何も足さないため）。
-->
<style>
  /* 本文中の画像は「押せる」ことが分かる見た目にする */
  section img {
    max-width: 100%;
    /* 端末ページのサンプル（480x800 など縦長）は、幅に合わせると画面を
       占領して読み進めにくい。高さで頭打ちにすると、縦長のものだけが
       縮み、横長のUIスクリーンショットは影響を受けない。
       原寸はクリックで開ける。 */
    max-height: 44vh;
    width: auto;
    height: auto;
    border: 1px solid #d8dde2;
    border-radius: 4px;
    cursor: zoom-in;
    background: #fff;
  }
  section img:hover { border-color: #a8b4c0; }

  #shot-overlay {
    position: fixed;
    inset: 0;
    background: rgba(16, 20, 24, 0.92);
    display: none;
    z-index: 9999;
    cursor: zoom-out;
    overflow: auto;
    padding: 24px;
    box-sizing: border-box;
  }
  #shot-overlay.open { display: block; }
  #shot-overlay img {
    display: block;
    margin: 0 auto;
    max-width: none;      /* 原寸で見せる。狭ければ横スクロールで追える */
    border: none;
    border-radius: 2px;
    background: #fff;
    cursor: zoom-out;
  }
  #shot-overlay .shot-hint {
    position: fixed;
    top: 12px;
    right: 16px;
    color: #e9edf1;
    font: 13px/1.6 -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: rgba(0, 0, 0, 0.45);
    padding: 4px 10px;
    border-radius: 4px;
    pointer-events: none;
  }
  @media print { #shot-overlay { display: none !important; } }
</style>

<script>
(function () {
  'use strict';
  document.addEventListener('DOMContentLoaded', function () {
    var overlay = document.createElement('div');
    overlay.id = 'shot-overlay';
    var full = document.createElement('img');
    var hint = document.createElement('div');
    hint.className = 'shot-hint';
    hint.textContent = 'クリックまたは Esc で閉じる';
    overlay.appendChild(full);
    overlay.appendChild(hint);
    document.body.appendChild(overlay);

    function open(src, alt) {
      full.src = src;
      full.alt = alt || '';
      overlay.classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function close() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
      full.removeAttribute('src');
    }

    var images = document.querySelectorAll('section img');
    for (var i = 0; i < images.length; i++) {
      (function (img) {
        img.addEventListener('click', function () { open(img.src, img.alt); });
      })(images[i]);
    }
    overlay.addEventListener('click', close);
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') { close(); }
    });
  });
})();
</script>

<!--
  左の欄（スマホでは上）に、マニュアルの目次を常に出す。
  jekyll-theme-minimal は各章のページから目次へ戻る手段がなく、ジャンプしづらいため。
  章を足したり名前を変えたりしたら、ここの一覧も直す。
-->
<style>
  #manual-toc { margin: 18px 0 8px; font-size: 13px; line-height: 1.5; }
  #manual-toc a.toc-top { display: inline-block; font-weight: bold; margin-bottom: 6px; }
  #manual-toc ol { margin: 0; padding-left: 2.2em; }
  #manual-toc li { margin: 1px 0; }
  #manual-toc li.current > a { font-weight: bold; color: #222; }
  #manual-toc details > summary { cursor: pointer; font-weight: bold; }
</style>
<script>
(function () {
  'use strict';
  var base = '{{ site.baseurl }}/docs/manual/';
  var chapters = [
    ['01-getting-started', 'はじめに・画面の見方'],
    ['02-android-studio', 'Android StudioとAVDを用意する'],
    ['03-japanese-and-reader', 'Androidを日本語にし、リーダーアプリを準備する'],
    ['04-keyboard-and-sleep', 'キーボード入力と画面消灯の設定'],
    ['05-launch-avd', 'ebook2xtcからAVDを起動する'],
    ['06-before-capture', 'キャプチャ前の準備'],
    ['07-capture', '作業フォルダーの作成とキャプチャ'],
    ['08-stability', 'ページ安定判定の詳細'],
    ['09-density', 'DPI調整で表示を試す'],
    ['10-export', 'プレビューとXTC／XTCH出力'],
    ['11-raw-cleanup', '中間PNGの削除'],
    ['12-resume', '中断と再開'],
    ['13-migration', 'AVD環境と設定の持ち運び'],
    ['14-faq', 'よくある質問・困ったとき'],
    ['15-status', '対応状況と安全上の注意']
  ];
  document.addEventListener('DOMContentLoaded', function () {
    var header = document.querySelector('header');
    if (!header) { return; }
    var path = location.pathname.replace(/\.html$/, '').replace(/\/$/, '');
    var nav = document.createElement('nav');
    nav.id = 'manual-toc';
    var details = document.createElement('details');
    // 広い画面では開いた状態、スマホでは畳んで本文を先に見せる。
    details.open = window.matchMedia('(min-width: 961px)').matches;
    var summary = document.createElement('summary');
    summary.textContent = '目次';
    details.appendChild(summary);
    var top = document.createElement('a');
    top.className = 'toc-top';
    top.href = base;
    top.textContent = 'マニュアルのトップ';
    details.appendChild(top);
    var list = document.createElement('ol');
    chapters.forEach(function (chapter) {
      var item = document.createElement('li');
      var link = document.createElement('a');
      link.href = base + chapter[0] + '.html';
      link.textContent = chapter[1];
      if (path.slice(-chapter[0].length) === chapter[0]) { item.className = 'current'; }
      item.appendChild(link);
      list.appendChild(item);
    });
    details.appendChild(list);
    nav.appendChild(details);
    var after = header.querySelector('p') || header.querySelector('h1');
    if (after && after.parentNode === header) {
      header.insertBefore(nav, after.nextSibling);
    } else {
      header.appendChild(nav);
    }
  });
})();
</script>
